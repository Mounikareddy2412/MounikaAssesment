services:
  api:
    build: ./server
    environment:
      PORT: 4000
      JWT_SECRET: local-docker-secret-change-me
      CLIENT_ORIGIN: http://localhost:8080
      DATA_FILE: /app/data/app-data.json
    volumes:
      - todo-data:/app/data

  web:
    build: ./client
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  todo-data:
